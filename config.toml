# Configuración de ao3-book. Las rutas son relativas a la carpeta de este archivo.
# Este archivo está documentado en español e inglés; el programa ignora los comentarios (#).
# EN: ao3-book configuration. Paths are relative to the folder containing this file.
# EN: This file is documented in Spanish and English; the program ignores comments (#).

[input]                  # carpetas de entrada (.html de AO3) y salida (PDFs generados)
# EN: input folder (AO3 .html files) and output folder (generated PDFs)

dir = "input"            # carpeta con los .html de AO3
# EN: folder containing the AO3 .html files

output_dir = "output"    # carpeta donde se guardan los PDF
# EN: folder where generated PDFs are saved

[book]                   # formato general, paginación y tipografía del libro
# EN: general book format, pagination, and typography

format = "a5"            # a4 | a5 | a6 | letter | booklet
# EN: book page format: a4 | a5 | a6 | letter | booklet

combine = false          # true: un solo PDF con todas las obras; false: un PDF por obra
# EN: true: one combined PDF with all works; false: one PDF per work

start_on_recto = true    # cada obra empieza en página derecha (agrega páginas en blanco si hace falta)
# EN: each work starts on a right-hand page (adds blank pages if needed; only with combine = true)

toc_on_recto = false     # el índice empieza en página derecha (agrega página en blanco tras la portada si hace falta)
# EN: table of contents starts on a right-hand page (adds a blank page after the title page if needed)

font_family = "Georgia, 'Times New Roman', serif"  # tipo de letra (fuentes del sistema; admite lista de respaldo)
# EN: font family (uses fonts installed on your system; supports a fallback list)

font_size = "11pt"       # tamaño base de la letra (escala proporcionalmente todo el libro)
# EN: base font size (scales the entire book proportionally)

line_height = 1.45       # interlineado (más alto = más aireado y más páginas)
# EN: line height (spacing between lines; higher = more open and more pages)

[booklet]                     # opciones exclusivas del modo folleto (format = "booklet")
# EN: options specific to booklet mode (format = "booklet")

sheet = "a4"                  # hoja física para el folleto: a4 | a5 | letter (la página es la mitad de la hoja)
# EN: physical sheet size for booklet printing: a4 | a5 | letter (book page is half the sheet)

signatures = false            # true: dividir el folleto en cuadernillos; false: un único cuadernillo
# EN: true: split the booklet into multiple signatures; false: a single signature

sheets_per_signature = 30     # hojas físicas por cuadernillo (1 hoja doblada = 4 páginas del libro)
# EN: physical sheets per signature (1 folded sheet = 4 book pages)

balance = false               # false: cuadernillos llenos + último más chico; true: repartir hojas parejo (solo con signatures = true)
# EN: false: full signatures + smaller last one; true: distribute sheets evenly (only with signatures = true)

[split]                           # división de obras largas en partes (automática) o en tomos (manual)
# EN: splitting long works into parts (automatic) or volumes (manual)

split_long_works = false          # división automática por páginas (sin cortar capítulos)
# EN: automatic splitting by page count (never splits mid-chapter)

max_pages_per_part = 600          # páginas máximas por parte (páginas del PDF, no hojas)
# EN: maximum pages per part (book PDF pages, not physical sheets)

enabled = false                   # división manual en tomos (requiere un único .html en la carpeta de entrada)
# EN: manual splitting into volumes (requires a single .html file in the input folder)

# volumes = ["1-3", "4-5", "6-8"] # un string por tomo ("N" o "N-M", según posición del capítulo desde 1)
# EN: one string per volume ("N" or "N-M", using 1-based chapter positions)

# names = ["Año 1", "Año 3", "Año 5"] # opcional; subtítulo en portada y sufijo en el nombre del PDF
# EN: optional; subtitle on the title page and suffix in the PDF filename

renumber_chapters = false         # false: conserva numeración original; true: cada tomo/parte reinicia en Chapter 1
# EN: false: keep original chapter numbering; true: restart at Chapter 1 in each volume/part
